version: 2

project_name: pi-connect

builds:
  - id: linux-amd64
    main: ./cmd/pi-connect
    binary: pi-connect
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.buildTime={{ .Date }}

archives:
  - id: linux-amd64
    ids: [linux-amd64]
    formats: [binary]
    name_template: pi-connect-linux-amd64

release:
  github:
    owner: tasercake
    name: pi-connect
  name_template: latest
  mode: replace
