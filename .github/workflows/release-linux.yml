name: release-linux

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: cd web && pnpm install --frozen-lockfile && pnpm build

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --skip=publish --clean

      - name: Stage release binary
        run: cp dist/linux-amd64_linux_amd64_v1/pi-connect dist/pi-connect-linux-amd64

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Linux Build
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/pi-connect-linux-amd64
          fail_on_unmatched_files: true
