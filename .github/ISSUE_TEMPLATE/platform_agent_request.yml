name: Platform Support Request
description: Request support for a new messaging platform
title: "[Support Request] "
labels: ["new-integration"]

body:
  - type: markdown
    attributes:
      value: |
        Want pi-connect to support a new messaging platform? Let us know!

  - type: input
    id: name
    attributes:
      label: Platform Name
      placeholder: "e.g. Microsoft Teams, WhatsApp, etc."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Brief description of the platform and why you'd like it supported.
    validations:
      required: true

  - type: textarea
    id: api-info
    attributes:
      label: API / SDK Information
      description: |
        Please share any relevant links to official documentation, bot APIs, SDKs, or developer resources.
      placeholder: |
        - Official docs: https://...
        - Bot API: https://...
        - SDK (Go/Python/Node): https://...
    validations:
      required: false

  - type: dropdown
    id: connection
    attributes:
      label: Connection Type
      description: If known, what type of connection does this platform support for bots?
      options:
        - WebSocket (no public IP needed)
        - Long Polling (no public IP needed)
        - Stream / SSE (no public IP needed)
        - Webhook (public URL required)
        - Unknown / Not sure
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about why this integration would be valuable.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Willingness to Contribute
      description: Would you be willing to help implement this integration?
      options:
        - label: I'd be willing to submit a PR for this integration
